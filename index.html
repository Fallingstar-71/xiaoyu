<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRACE 轨迹实验室</title><style>html,body{margin:0}</style>
<style>
:root{--bg:#f5f6f8;--panel:#ffffff;--panel2:#f3f4f7;--line:#e4e6ec;--tx:#1c2030;--mut:#7a8095;--acc:#3556e0;--acc2:#3556e0;--acc-tx:#ffffff;--stage:#0a0b12;--danger:#d6414b;--shadow:0 12px 40px rgba(25,32,60,.16);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.45 "Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{white-space:nowrap;cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;transition:background .15s,border-color .15s}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-tx);border-color:var(--acc);font-weight:600}
button.pri:hover{filter:brightness(1.08)}
button.ic{padding:4px 7px;min-width:28px}
button.on{border-color:var(--acc);color:var(--acc)}
button.dng:hover{border-color:var(--danger);color:var(--danger)}
button:disabled{opacity:.4;cursor:default}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-width:0;max-width:100%}
input[type=number]{width:72px}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
input[type=range]{accent-color:var(--acc);width:100%;min-width:0}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:8px max(14px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:6px}
.brand b{font:600 19px "Cinzel","Noto Serif SC",serif;letter-spacing:.28em;color:var(--tx)}
.brand i{font-style:normal;font-size:10px;color:var(--mut);letter-spacing:.12em}
#pname{width:170px;font-weight:600}
.sp{flex:1}
.grp{display:flex;gap:4px;align-items:center}
main{display:grid;grid-template-columns:268px minmax(0,1fr) 300px;min-height:0}
.side{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:8px 4px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.pane{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.pane[hidden]{display:none}
.center{display:grid;grid-template-rows:minmax(0,1fr) auto auto;min-width:0;min-height:0}
#stagewrap{position:relative;background:var(--stage);display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
#stage{display:block;box-shadow:0 0 0 1px var(--line);touch-action:none;cursor:crosshair}
#stagebar{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 16px)}
#stagebar button{background:rgba(18,20,28,.78);color:#e1e5f0;border-color:#2c3042;backdrop-filter:blur(4px)}
#stagebar button.on{border-color:#ffe3a3;color:#ffe3a3}
#hint{position:absolute;bottom:8px;left:10px;color:#8a91a8;font-size:11px;pointer-events:none;max-width:70%}
#transport{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
#tcode{font:600 14px ui-monospace,Menlo,Consolas,monospace;min-width:96px;color:var(--acc)}
#tl{background:var(--panel);border-top:1px solid var(--line);height:232px;display:grid;grid-template-columns:150px minmax(0,1fr);min-height:0;position:relative}
#tlnames{overflow:hidden;border-right:1px solid var(--line);background:var(--panel)}
#tlscroll{overflow:auto;position:relative}
#tlinner{position:relative}
.tlrow{height:26px;border-bottom:1px solid var(--line);position:relative}
.tlname{height:26px;border-bottom:1px solid var(--line);padding:0 8px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;cursor:pointer}
.tlname.sel,.tlrow.sel{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.tlname i{width:9px;height:9px;border-radius:50%;flex:none}
#ruler{touch-action:none;height:24px;position:sticky;top:0;z-index:5;background:var(--panel2);border-bottom:1px solid var(--line);cursor:ew-resize}
#ruler span{position:absolute;top:4px;font-size:10px;color:var(--mut);transform:translateX(3px);pointer-events:none}
#ruler s{position:absolute;bottom:0;width:1px;height:7px;background:var(--mut)}
.bar{touch-action:none;position:absolute;top:5px;height:16px;border-radius:4px;opacity:.55;cursor:grab}
.bar.sel{opacity:.85}
.bar .h{position:absolute;top:0;bottom:0;width:6px;cursor:ew-resize}
.bar .h.l{left:0}.bar .h.r{right:0}
.kf{position:absolute;top:8px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:var(--panel);border:1.5px solid var(--tx);touch-action:none;cursor:ew-resize;z-index:2}
.kf.on{background:var(--acc)}
.mk{touch-action:none;position:absolute;top:4px;margin-left:-6px;width:12px;height:18px;border-radius:3px;background:var(--acc);cursor:ew-resize;z-index:2}
#phead{position:absolute;top:0;bottom:0;width:2px;background:#ff5a6a;z-index:6;pointer-events:none}
#phead:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#ff5a6a}
.endmark{position:absolute;top:5px;width:10px;height:16px;border-radius:3px;background:#ddd;opacity:.8;margin-left:-1px}
footer{display:flex;gap:14px;align-items:center;padding:4px 14px;background:var(--panel);border-top:1px solid var(--line);color:var(--mut);font-size:11px;flex-wrap:wrap}
footer .cr{margin-left:auto;letter-spacing:.08em}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.card h4{margin:0;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.06em}
.f{display:grid;grid-template-columns:76px minmax(0,1fr) 40px;align-items:center;gap:6px}
.f.s{grid-template-columns:76px minmax(0,1fr)}
.f span{color:var(--mut);font-size:12px}
.f b{font-weight:400;font-size:11px;color:var(--mut);text-align:right}
.f.chk{grid-template-columns:auto 1fr;justify-content:start}
.chlist{display:flex;flex-direction:column;gap:3px}
.chi{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid transparent;border-radius:7px;cursor:pointer}
.chi:hover{background:var(--panel2)}.chi.sel{border-color:var(--acc);background:var(--panel2)}
.chi.dragover{border-top:2px solid var(--acc)}
.chi .dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.chi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chi button{padding:1px 5px;border:0;background:none;color:var(--mut)}
.chi button:hover{color:var(--acc)}
.chi.off .nm{opacity:.4;text-decoration:line-through}
.mut{color:var(--mut)}
.small{font-size:11px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s,visibility .22s;visibility:hidden;box-shadow:none}
.drawer.open{transform:none;visibility:visible;box-shadow:var(--shadow)}
.drawer.wide{width:min(720px,100vw)}
.drawer>header{padding:10px 14px;border-bottom:1px solid var(--line)}
.drawer>header h3{margin:0;font-size:15px;flex:1}
.dbody{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:94vh;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.mbox>header{border-bottom:1px solid var(--line)}
.mbox h3{margin:0;flex:1;font-size:15px}
.mbody{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:700px){.mbody{grid-template-columns:1fr}}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.fontgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.fcard{border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;background:var(--panel2);display:flex;flex-direction:column;gap:2px}
.fcard:hover{border-color:var(--acc)}.fcard.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.fcard .pv{font-size:22px;line-height:1.2;white-space:nowrap;overflow:hidden}
.fcard small{color:var(--mut);font-size:10px}
.pal{display:flex;flex-direction:column;gap:3px;padding:6px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel2)}
.pal:hover{border-color:var(--acc)}
.pal div{display:flex;height:16px;border-radius:4px;overflow:hidden}.pal div i{flex:1}
.palgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.tpl{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:var(--panel2);display:flex;flex-direction:column}
.tpl:hover{border-color:var(--acc)}
.tpl canvas{width:100%;display:block;background:#05050a}
.tpl div{padding:6px 8px}.tpl b{display:block}.tpl span{color:var(--mut);font-size:11px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .1s}
#xprev{width:100%;background:#05050a;border:1px solid var(--line);border-radius:8px;display:block}
#xvideo{width:100%;border-radius:8px;background:#000;display:block}
.stops{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.stops .sw{display:flex;align-items:center;gap:2px}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--acc);padding:8px 14px;border-radius:8px;z-index:90;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.show{opacity:1}

button{border-radius:8px;background:var(--panel);}
.card{background:var(--panel);border:1px solid var(--line)}
.pane{background:var(--bg)}
.chi:hover{background:var(--panel2)}.chi.sel{background:var(--panel);box-shadow:0 0 0 1.5px var(--acc)}
.tlname.sel,.tlrow.sel{background:color-mix(in srgb,var(--acc) 7%,transparent)}
.fcard,.pal,.tpl{background:var(--panel)}
.seg button.on,.tabs button.on{color:var(--acc)}
.seg button.on{background:color-mix(in srgb,var(--acc) 12%,#fff);color:var(--acc);border-color:var(--acc)}
.pri.on{color:#fff}
#mnav{display:none}
.stage-fs{display:none}
/* ---- tablet / phone ---- */
@media (max-width:1100px){
  body{overflow:hidden}
  #app{height:100vh;height:100dvh}
  main{display:flex;flex-direction:column;min-height:0}
  #left,#right{display:none;flex:1;border:0;min-height:0}
  .center{display:contents}
  #stagewrap{flex:none;height:42dvh;min-height:210px;order:-1}
  header{order:-2}
  #transport,#tl{display:none}
  body[data-m="tl"] #transport{display:flex}
  body[data-m="tl"] #tl{display:grid;flex:1;height:auto;min-height:150px}
  body[data-m="left"] #left{display:flex}
  body[data-m="right"] #right{display:flex}
  body[data-m="tl"] #transport{order:2}body[data-m="tl"] #tl{order:3}
  #mnav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
  #mnav button{flex:1;border:0;border-radius:0;background:none;padding:10px 4px;color:var(--mut)}
  #mnav button.on{color:var(--acc);font-weight:600;box-shadow:inset 0 2px 0 var(--acc)}
  #app{grid-template-rows:auto 1fr auto auto}
  #hint{display:none}
  .brand i{display:none}
  header{gap:6px;padding-top:6px;padding-bottom:6px}
  #pname{width:130px}
  footer{display:none}
  .drawer{width:100vw}
}
@media (max-width:640px){
  header .grp:has(#aspect) span,header .grp:has(#dur) span:last-child{display:none}
  #bFont,#bColor{display:none}
  #tcode{min-width:0;font-size:12px}
  #transport{gap:5px;padding:6px 8px}
  #tzoomwrap{display:none}
  #tl{grid-template-columns:92px minmax(0,1fr)!important}
  .f{grid-template-columns:70px minmax(0,1fr) 38px}
  button,select,input{font-size:14px}
  #stagebar button{padding:3px 7px;font-size:12px}
}
@media (min-width:1101px) and (max-width:1300px){main{grid-template-columns:230px minmax(0,1fr) 270px}}

</style></head><body>
<div id="app">
<header>
  <div class="brand"><b>TRACE</b><i>人物轨迹实验室 · 让每个人的故事，都有自己的轨迹</i></div>
  <input id="pname" type="text" aria-label="项目名称">
  <div class="grp"><button class="ic" id="bUndo" title="撤销 Ctrl+Z">↶</button><button class="ic" id="bRedo" title="重做 Ctrl+Shift+Z">↷</button></div>
  <div class="grp"><span class="mut small">画幅</span><select id="aspect"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option><option>3:4</option><option>21:9</option></select></div>
  <div class="grp"><span class="mut small">总时长</span><input id="dur" type="number" min="3" max="300" step="1"><span class="mut small">秒</span></div>
  <div class="sp"></div>
  <div class="grp">
    <button id="bTpl">模板 / 项目</button>
    <button id="bFont">字体与文字</button>
    <button id="bColor">配色系统</button>
    <button class="pri" id="bExport">导出视频</button>
  </div>
</header>
<main>
  <section class="side" id="left">
    <div class="tabs" id="ltabs"><button data-t="chars" class="on">角色</button><button data-t="events">事件</button><button data-t="texts">文字</button></div>
    <div class="pane" id="p-chars"></div>
    <div class="pane" id="p-events" hidden></div>
    <div class="pane" id="p-texts" hidden></div>
  </section>
  <section class="center">
    <div id="stagewrap">
      <canvas id="stage"></canvas>
      <div id="stagebar">
        <button id="mSel" class="on" title="选择/拖动控制点；双击空白处添加控制点">选择</button>
        <button id="mDraw" title="按住鼠标在画布上自由绘制所选角色的轨迹">绘制轨迹</button>
        <button id="mEvt" title="点击所选轨迹上的位置，添加事件节点">事件节点</button>
        <button id="mCam" title="用最终相机预览（跟随/拉远）；关闭则为自由编辑视角">相机预览</button>
        <button id="mFit" title="适配全部轨迹">适配</button>
        <button id="mEdit" class="on" title="显示/隐藏编辑辅助线（不会导出）">辅助线</button>
      </div>
      <div id="hint"></div>
    </div>
    <div id="transport">
      <button class="ic" id="bStart" title="回到开头">⏮</button>
      <button class="ic" id="bPrev" title="上一帧 ←">◀︎|</button>
      <button class="pri" id="bPlay" style="min-width:64px">▶ 播放</button>
      <button class="ic" id="bNext" title="下一帧 →">|▶︎</button>
      <span id="tcode">0.0 / 30.0</span>
      <label class="row small mut">速度<select id="spd"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
      <label class="row small mut"><input type="checkbox" id="loop" checked>循环</label>
      <span class="sp"></span>
      <button id="bAddKf" title="在当前时间给所选角色插入一个控制点（关键帧）">＋关键帧</button>
      <label class="row small mut" id="tzoomwrap">缩放<input id="tzoom" type="range" min="10" max="160" value="40" style="width:110px"></label>
    </div>
    <div id="tl"><div id="tlnames"></div><div id="tlscroll"><div id="tlinner"><div id="ruler"></div><div id="tlrows"></div><div id="phead"></div></div></div></div>
  </section>
  <section class="side" id="right">
    <div class="tabs" id="rtabs"><button data-t="path" class="on">轨迹</button><button data-t="look">外观</button><button data-t="txt">文字</button></div>
    <div class="pane" id="r-path"></div>
    <div class="pane" id="r-look" hidden></div>
    <div class="pane" id="r-txt" hidden></div>
  </section>
</main>
<nav id="mnav"><button data-m="tl" class="on">时间轴</button><button data-m="left">角色</button><button data-m="right">属性</button><button data-act="mFont">字体</button><button data-act="openColor">配色</button></nav>
<footer><span id="status">就绪</span><span id="saved" class="mut"></span><span class="cr" id="credit">TRACE · 创作者：鱼是有了你</span></footer>
</div>
<aside class="drawer wide" id="dFont"></aside>
<aside class="drawer" id="dColor"></aside>
<aside class="drawer" id="dTpl"></aside>
<aside class="drawer" id="dRel"></aside>
<div class="modal" id="mExport"><div class="mbox" id="xbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileProj" accept=".json,application/json" hidden>
<input type="file" id="fileFont" accept=".ttf,.otf,.woff,.woff2" hidden>

<script>
/* ============ TRACE core: math, colour, fonts, data model, path sampling ============ */
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const deep = o => JSON.parse(JSON.stringify(o));
const fmtTime = t => { t = Math.max(0, t); const m = Math.floor(t / 60), s = t - m * 60; return (m ? m + ':' : '') + (m ? s.toFixed(1).padStart(4, '0') : s.toFixed(1)) + (m ? '' : 's'); };

/* ---- colour helpers ---- */
function hex2rgb(h) {
  h = String(h || '#ffffff').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16);
  return isNaN(n) ? [255, 255, 255] : [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgb2hex = (r, g, b) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) {
    const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60;
  }
  return [h, s, l];
}
function hsl2rgb(h, s, l) {
  h = ((h % 360) + 360) % 360 / 360;
  if (s === 0) return [l * 255, l * 255, l * 255];
  const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255];
}
const hsl2hex = (h, s, l) => rgb2hex(...hsl2rgb(h, s, l));
const mixRgb = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${clamp(a, 0, 1).toFixed(3)})`;
function tweakRgb(c, bright, sat) {

  let msg; if (typeof VideoEncoder === 'undefined') msg = '⚠ 本浏览器无 WebCodecs，将使用实时录制兼容模式（耗时等于动画时长）。建议使用最新版 Chrome / Edge。'; else { const p = await pickCodec(XS.format, W, H, XS.fps, br); msg = p ? `✓ 逐帧编码可用 · ${p.codec} · ${W}×${H}` + (XS.format === 'mp4' && p.container !== 'mp4' ? '' : '') : (XS.format === 'mp4' ? '⚠ 本机无 H.264 编码器，将自动改用 WebM(VP9)导出。' : '⚠ 本机不支持 VP9 编码，将使用兼容模式。'); }
  XS.support = msg; const e2 = $('#xsup'); if (e2) e2.textContent = msg;
}
Object.assign(ACTS, {
  xSet: a => { const k = a.dataset.k, v = a.dataset.v; XS[k] = (k === 'fps') ? +v : v; renderExport(); },
  xClose: () => { if (XS.busy && XS.ctrl) XS.ctrl.abort(); $('#mExport').classList.remove('open'); },
  xCancel: () => { XS.ctrl && XS.ctrl.abort(); },
  xStart: async () => {
    if (XS.busy) return; XS.busy = true; XS.result = null; XS.ctrl = new AbortController(); setPlaying(false); renderExport();
    const bar = () => $('#xbar'), msg = () => $('#xmsg'); const Q = xProject();
    try {
      const r = await exportVideo(Q, { format: XS.format, res: XS.res, fps: XS.fps, duration: XS.dur, signal: XS.ctrl.signal, onProgress: (f, m) => { if (bar()) bar().style.width = (f * 100).toFixed(1) + '%'; if (msg()) msg().textContent = m; } });
      XS.result = r; XS.busy = false; renderExport();
    } catch (e) { XS.busy = false; renderExport(); const m = $('#xmsg'); if (m) m.textContent = e.cancelled ? '已取消。' : '导出失败：' + (e.message || e) + '（可点击“重新导出”重试）'; const b = $('#xbtns'); if (b) b.innerHTML = '<button class="pri" data-act="xStart">重新导出</button>'; console.error(e); }
  },
  xSave: async () => { const r = XS.result; if (!r) return; await saveFile((P.name || 'trace') + '.' + r.ext, r.blob); },
});
function showResult() {
  const r = XS.result, el = $('#xres'); if (!el) return; const url = URL.createObjectURL(r.blob); XS.url && URL.revokeObjectURL(XS.url); XS.url = url;
  $('#xbar').style.width = '100%'; $('#xmsg').textContent = `完成 · ${r.w}×${r.h} · ${r.fps}fps · ${(r.blob.size / 1048576).toFixed(1)} MB · ${r.ext.toUpperCase()}${r.note ? '\n' + r.note : ''}`;
  el.innerHTML = `<video id="xvideo" src="${url}" controls playsinline></video><div class="row"><button class="pri" data-act="xSave">保存到本地</button><button data-act="xStart">重新导出</button></div><div class="small mut">${r.ext === 'webm' && XS.format === 'mp4' ? '注意：本机没有 H.264 编码器，已自动导出为 WebM。' : ''}若预览无法播放，仍可先保存再用播放器打开。</div>`;
  $('#xbtns').innerHTML = '';
}
$('#bExport').onclick = () => { XS.result = null; XS.dur = P.duration; renderExport(); $('#mExport').classList.add('open'); };
$('#mExport').addEventListener('pointerdown', e => { if (e.target.id === 'mExport' && !XS.busy) $('#mExport').classList.remove('open'); });

/* ---------------- bootstrap ---------------- */
(async function boot() {
  loadGoogleFonts();
  try { await idb.open(); const fs = await idb.all(); for (const f of fs) { try { await registerUploaded(f.family, f.label.replace(/\.[^.]+$/, ''), f.buf.slice(0)); } catch (e) { } } } catch (e) { }
  let restored = false;
  try { const s = JSON.parse(localStorage.getItem('trace.autosave') || 'null'); if (s && s.P && s.P.chars && s.P.chars.length) { loadProject(s.P, s.sel); restored = true; toast('已恢复上次编辑的项目（自动保存）'); } } catch (e) { }
  if (!restored) loadProject(TEMPLATES[0].build());
  resizeStage(); fitView(); snapOrig(); hist.length = 0; hi = -1; commit(true); setMode('sel');
  requestAnimationFrame(t => { lastTs = t; frame(t); });
  window.__trace = { get P() { return P; }, setT, T: () => T };
})();
